[project]
name = "capslap-portal"
version = "0.1.0"
description = "Review portal for PyCapSlap renders: series, episodes, caption fixes and feedback"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[project.scripts]
capslap-portal = "capslap_portal.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
